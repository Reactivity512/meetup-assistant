<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ошибка')}"></head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm text-center">
                <div class="card-body p-5">
                    <div class="display-1 fw-bold text-secondary" th:text="${status}">500</div>
                    <h1 class="h4 mt-2" th:text="${error}">Ошибка</h1>
                    <p class="text-secondary" th:text="${message}">Описание ошибки</p>
                    <a class="btn btn-primary mt-2" th:href="@{/meetups}">
                        <i class="bi bi-arrow-left"></i> К списку митингов
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
