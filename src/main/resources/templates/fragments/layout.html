<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Meetup Assistant'">Meetup Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/meetups}">
            <i class="bi bi-mic-fill"></i>
            <span>Meetup Assistant</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Меню">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/meetups}">Митинги</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/meetups/new}">Загрузить запись</a>
                </li>
            </ul>
            <span class="navbar-text small d-none d-lg-inline">Vosk · Spring AI · Ollama</span>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="py-3 mt-auto border-top bg-white">
    <div class="container d-flex flex-wrap justify-content-between gap-2 small text-secondary">
        <span><i class="bi bi-shield-lock"></i> Всё обрабатывается локально: Vosk и Ollama</span>
        <a class="link-secondary text-decoration-none" th:href="@{/actuator/health}" target="_blank">
            Состояние приложения <i class="bi bi-box-arrow-up-right"></i>
        </a>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
